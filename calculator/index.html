<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irium Mining Calculator</title>
    <link rel="stylesheet" href="../assets/css/calculator.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏️ Irium Mining Calculator</h1>
        </header>
        
        <div class="calculator">
            <div class="input-group">
                <label>Your Hashrate (H/s):</label>
                <input type="number" id="hashrate" placeholder="e.g., 100000">
            </div>
            
            <div class="input-group">
                <label>Current Network Hashrate (H/s):</label>
                <input type="number" id="network-hashrate" placeholder="Auto-detect">
            </div>
            
            <button onclick="calculate()">Calculate</button>
            
            <div class="results" id="results">
                <div class="result-item">
                    <span>Estimated Blocks/Day:</span>
                    <span id="blocks-per-day">-</span>
                </div>
                <div class="result-item">
                    <span>Estimated IRM/Day:</span>
                    <span id="irm-per-day">-</span>
                </div>
                <div class="result-item">
                    <span>Estimated IRM/Month:</span>
                    <span id="irm-per-month">-</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../assets/js/calculator.js"></script>
</body>
</html>
