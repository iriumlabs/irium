<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <div id="result">Testing...</div>
    
    <script>
        // Test 1: Direct API call
        fetch('https://api.iriumlabs.org/api/stats')
            .then(response => {
                console.log('Direct API call status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Direct API call success:', data);
                document.getElementById('result').innerHTML = 'SUCCESS: Direct API call works<br>' + JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('Direct API call failed:', error);
                document.getElementById('result').innerHTML = 'FAILED: Direct API call - ' + error.message;
            });
    </script>
</body>
</html>
