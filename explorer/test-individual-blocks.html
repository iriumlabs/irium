<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Blocks Test</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .block { background: rgba(0,0,0,0.3); padding: 15px; margin: 10px 0; border-radius: 8px; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h1>Individual Blocks Test</h1>
    <div id="results"></div>

    <script>
    const API_BASE = 'https://api.iriumlabs.org/api';
    const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

    async function fetchJson(path) {
        const url = CORS_PROXY + encodeURIComponent(`${API_BASE}${path}`);
        console.log('Fetching:', url);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    }

    async function testIndividualBlocks() {
        const results = document.getElementById('results');
        results.innerHTML = '<p>Testing individual block fetching...</p>';

        // Test blocks 0-3
        for (let height = 0; height <= 3; height++) {
            try {
                console.log(`Testing block ${height}...`);
                const data = await fetchJson(`/block/${height}`);
                console.log(`Block ${height} data:`, data);
                
                if (data && data.block && !data.error) {
                    results.innerHTML += `<div class="block success">✅ Block ${height}: ${data.block.hash}</div>`;
                } else if (data && !data.error) {
                    results.innerHTML += `<div class="block success">✅ Block ${height}: ${data.hash}</div>`;
                } else {
                    results.innerHTML += `<div class="block error">❌ Block ${height}: ${data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                console.error(`Error fetching block ${height}:`, error);
                results.innerHTML += `<div class="block error">❌ Block ${height}: ${error.message}</div>`;
            }
        }

        // Test /blocks endpoint
        try {
            console.log('Testing /blocks endpoint...');
            const data = await fetchJson('/blocks?limit=20');
            console.log('/blocks data:', data);
            const blocks = data.blocks || data || [];
            results.innerHTML += `<div class="block success">✅ /blocks endpoint: ${blocks.length} blocks (heights: ${blocks.map(b => b.height).join(', ')})</div>`;
        } catch (error) {
            console.error('Error fetching /blocks:', error);
            results.innerHTML += `<div class="block error">❌ /blocks endpoint: ${error.message}</div>`;
        }
    }

    // Run the test
    testIndividualBlocks();
    </script>
</body>
</html>
