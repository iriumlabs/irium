<!DOCTYPE html>
<html>
<head>
    <title>XMLHttpRequest Test</title>
</head>
<body>
    <h1>XMLHttpRequest Test</h1>
    <div id="result">Testing...</div>
    
    <script>
        console.log('Starting XMLHttpRequest test...');
        
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.iriumlabs.org/api/stats', true);
        xhr.onload = function() {
            console.log('XHR Status:', xhr.status);
            console.log('XHR Response:', xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300) {
                const data = JSON.parse(xhr.responseText);
                document.getElementById('result').innerHTML = 'SUCCESS: ' + JSON.stringify(data, null, 2);
            } else {
                document.getElementById('result').innerHTML = 'ERROR: Status ' + xhr.status;
            }
        };
        xhr.onerror = function() {
            console.error('XHR Error');
            document.getElementById('result').innerHTML = 'ERROR: Network error';
        };
        xhr.send();
    </script>
</body>
</html>
